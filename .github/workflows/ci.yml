# Runs on every push and pull request. A change merges only if every job passes.
# Hardening note: pin each action to a full commit SHA (Dependabot keeps them updated).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - name: ffmpeg (voice & video forensics, call recordings)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python scripts/make_demo.py
      - name: Lint
        run: ruff check app scripts tests
      - name: Unit, API (memory + SQL), security and property tests
        run: python -m pytest -q
      - name: Evaluation loop (offline) - fails if fraud slips through or false alarms rise
        run: python scripts/evaluate.py --min-catch 1.0 --max-false-alarm 0.10
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: vbw }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: ffmpeg (voice & video forensics, call recordings)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r requirements-dev.txt && python scripts/make_demo.py
      - name: Apply migrations from scratch, roll back, re-apply, and check for schema drift
        env: { DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/vbw" }
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Full test suite against real PostgreSQL (append-only audit trigger included)
        env: { VBW_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:test@localhost:5432/vbw", DB_AUTO_MIGRATE: "false" }
        run: python -m pytest -q
  firestore:
    # The same API tests against the Cloud Firestore emulator (the store used on Firebase / Cloud Run).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -r backend/requirements-dev.txt && python backend/scripts/make_demo.py
      - name: API tests on the Firestore emulator (firestore rules from firebase.json loaded)
        run: npx -y firebase-tools@14 emulators:exec --only firestore --project demo-vbw "cd backend && python -m pytest -q -k firestore"
  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Static analysis (Bandit)
        run: bandit -r backend/app -ll
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit -r backend/requirements.txt
      # The gitleaks CLI scans the whole history (the gitleaks Action needs a paid licence for
      # organisation-owned repos). Reviewed false positives are listed in .gitleaksignore.
      - name: Leaked secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner -v
      - name: Filesystem + IaC scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "python,javascript" }
      - uses: github/codeql-action/analyze@v3
  image:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vbw:ci .
      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "vbw:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
